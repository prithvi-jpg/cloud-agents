name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository project spine
        run: python skill/adaptive-agent-operating-system/scripts/validate_project.py --root .
      - name: Compile Python sources
        run: python -m compileall -q skill/adaptive-agent-operating-system/scripts tests
