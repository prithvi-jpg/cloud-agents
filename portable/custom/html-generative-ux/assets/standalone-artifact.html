<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Effective HTML artifact</title>
  <style>
    :root {
      --bg: #faf9f5;
      --panel: #f1ede4;
      --text: #171715;
      --muted: #686660;
      --line: #d8d3c8;
      --accent: #d97757;
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(72rem, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 80px; }
    .eyebrow { color: var(--accent); font: 700 12px/1.2 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { max-width: 18ch; margin: 12px 0; font-size: clamp(2rem, 6vw, 4.75rem); line-height: .98; letter-spacing: -.05em; }
    .lede { max-width: 62ch; color: var(--muted); font-size: 1.1rem; }
    .surface { margin-top: 36px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: clamp(18px, 4vw, 36px); }
    button { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171715; --panel: #22221f; --text: #faf9f5; --muted: #b7b3aa; --line: #44423d; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Purpose, not template</div>
      <h1>State the dominant claim or action.</h1>
      <p class="lede">Supply only the context required to trust the artifact. Replace this shell's surface with the information form the task actually needs.</p>
    </header>
    <section class="surface" aria-label="Primary interactive surface">
      <p>The first view should already be useful.</p>
      <button type="button">One consequential action</button>
    </section>
  </main>
</body>
</html>
